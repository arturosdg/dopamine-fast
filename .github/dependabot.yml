version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
      include:
        - "*"
    groups:
      npm-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minors:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
      npm-majors:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    # Conventional Commits: deps(deps): ... or deps(deps-dev): ...
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
      include:
        - "*"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
    # Conventional Commits: deps(deps): ...
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
