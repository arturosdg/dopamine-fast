name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Create or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released source
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Validate released source
        if: ${{ steps.release.outputs.release_created }}
        run: npm run validate

      - name: Package extension
        if: ${{ steps.release.outputs.release_created }}
        run: npm run zip

      - name: Generate checksums
        if: ${{ steps.release.outputs.release_created }}
        working-directory: .output
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Attach packages to the GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: >-
          gh release upload "${RELEASE_TAG}"
          .output/*-firefox.zip
          .output/*-chrome.zip
          .output/*-sources.zip
          .output/SHA256SUMS.txt
          --clobber

      - name: Submit Firefox package to AMO
        if: ${{ steps.release.outputs.release_created }}
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          if [[ -z "${FIREFOX_EXTENSION_ID}" || -z "${FIREFOX_JWT_ISSUER}" || -z "${FIREFOX_JWT_SECRET}" ]]; then
            echo "::notice::Skipping AMO submission until FIREFOX_EXTENSION_ID, FIREFOX_JWT_ISSUER and FIREFOX_JWT_SECRET are configured."
            exit 0
          fi

          npx wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip \
            --firefox-channel listed
